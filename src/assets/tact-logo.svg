<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-label="Tact Architecture and Decoration and Furniture">
  <defs>
    <linearGradient id="tactGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1B27E"/>
      <stop offset="50%" stop-color="#C89052"/>
      <stop offset="100%" stop-color="#A76F35"/>
    </linearGradient>
    <path id="tactCircleText" d="M 250,250 m -210,0 a 210,210 0 1,1 420,0 a 210,210 0 1,1 -420,0"/>
  </defs>

  <!-- Outer rings -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#0D0D0D" stroke-width="1.2"/>
  <circle cx="250" cy="250" r="225" fill="none" stroke="#0D0D0D" stroke-width="1.2"/>

  <!-- Curved brand text -->
  <text font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif"
        font-size="26" letter-spacing="6" fill="#0D0D0D" font-weight="400">
    <textPath href="#tactCircleText" startOffset="50%" text-anchor="middle">
      Tact Architecture &amp; Decoration &amp; Furniture
    </textPath>
  </text>

  <!-- Stylized "T" monogram -->
  <g fill="url(#tactGold)">
    <!-- Top horizontal bar -->
    <rect x="130" y="155" width="240" height="70" rx="18"/>
    <!-- Left descending pillar -->
    <rect x="155" y="195" width="55" height="180" rx="27"/>
    <!-- Center main pillar -->
    <rect x="222" y="195" width="56" height="220" rx="28"/>
    <!-- Right descending pillar (shorter) -->
    <rect x="290" y="195" width="55" height="120" rx="27"/>
    <!-- Right dot -->
    <circle cx="317" cy="345" r="28"/>
  </g>
</svg>
